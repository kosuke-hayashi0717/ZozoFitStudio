<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><link rel="manifest" href="manifest.webmanifest"><title>ZOZO FIT STUDIO</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#171717;background:#f6f6f6}*{box-sizing:border-box}body{margin:0}header{background:#151515;color:white;padding:17px 18px;display:flex;align-items:center;justify-content:space-between}header strong{letter-spacing:.08em}header small{font-size:11px;color:#bbb}.layout{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(280px,1fr) minmax(310px,1fr);gap:18px;padding:18px}.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 3px 16px #00000008}h2{font-size:17px;margin:0 0 14px}.muted{color:#777;font-size:12px;line-height:1.5}.stage{position:relative;height:490px;background:radial-gradient(ellipse at 50% 35%,#fff,#e8e8e8);border-radius:15px;overflow:hidden;display:flex;justify-content:center;align-items:center}.person{position:relative;width:210px;height:450px}.head{position:absolute;top:18px;left:81px;width:48px;height:62px;background:#d6b29a;border-radius:44% 44% 45% 45%;z-index:2}.neck{position:absolute;top:69px;left:94px;width:23px;height:25px;background:#d6b29a}.torso{position:absolute;top:87px;left:48px;width:114px;height:166px;background:#c8c8c8;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);border-radius:20px}.arm{position:absolute;top:92px;width:28px;height:197px;background:#d6b29a;border-radius:25px}.arm.left{left:19px;transform:rotate(7deg)}.arm.right{right:19px;transform:rotate(-7deg)}.leg{position:absolute;top:244px;width:47px;height:171px;background:#d6b29a;border-radius:9px 9px 14px 14px}.leg.left{left:55px;transform:rotate(2deg)}.leg.right{right:55px;transform:rotate(-2deg)}.wear-top{position:absolute;top:87px;left:37px;width:136px;height:164px;z-index:5;clip-path:polygon(18% 0,82% 0,100% 12%,92% 41%,82% 35%,82% 100%,18% 100%,18% 35%,8% 41%,0 12%);background:#ededed}.wear-bottom{position:absolute;top:241px;left:51px;width:108px;height:177px;z-index:6;clip-path:polygon(0 0,100% 0,95% 100%,54% 100%,50% 28%,46% 100%,5% 100%);background:#343434}.shoe{position:absolute;top:402px;width:55px;height:23px;border-radius:9px 13px 5px 5px;background:#eee;z-index:7}.shoe.left{left:48px}.shoe.right{right:48px}.label{position:absolute;bottom:10px;left:10px;font-size:11px;color:#888}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,.btn{background:#161616;color:white;border:0;border-radius:10px;padding:11px 13px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#eee;color:#222}button.active{background:#e1e1e1;color:#111;outline:2px solid #111}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font-size:15px;background:white}label{font-size:12px;font-weight:600;display:block;margin:12px 0 5px}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:385px;overflow:auto}.item{border:1px solid #eee;border-radius:12px;padding:10px;cursor:pointer}.item.selected{outline:2px solid #111}.swatch{height:80px;border-radius:9px;display:grid;place-items:center;font-size:32px;margin-bottom:7px}.item b{display:block;font-size:12px}.item span{font-size:12px;color:#666}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.total{font-weight:800;font-size:22px}.hint{padding:10px;background:#f5f5f5;border-radius:9px;font-size:12px;margin-top:12px}.saved{margin-top:12px;font-size:12px}.rank{display:flex;gap:8px;align-items:center;margin-bottom:10px}.rank a{font-size:12px;color:#333}.badge{background:#eee;padding:4px 7px;border-radius:7px;font-size:11px}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:10px;gap:10px}.panel{padding:14px}.stage{height:430px}.person{transform:scale(.9)}header{padding:14px}}
</style></head><body><header><strong>ZOZO FIT STUDIO</strong><small>OUTFIT PREVIEW · v1.1</small></header><main class="layout"><section class="panel"><h2>全身コーデプレビュー</h2><div class="stage" id="stage"><div class="person"><div class="head"></div><div class="neck"></div><div class="arm left"></div><div class="arm right"></div><div class="torso"></div><div class="leg left"></div><div class="leg right"></div><div class="wear-top" id="topWear"></div><div class="wear-bottom" id="bottomWear"></div><div class="shoe left" id="shoeL"></div><div class="shoe right" id="shoeR"></div></div><div class="label">簡易シルエット表示 / 実物の形状は再現されません</div></div><div class="actions"><button id="save">♡ コーデ保存</button><button class="secondary" id="reset">リセット</button><button class="secondary" id="shot">画像保存</button></div><p class="muted">商品画像を直接合成する機能ではなく、色とカテゴリによる簡易試着プレビューやで。</p><div id="saved" class="saved"></div><div class="actions"><button class="secondary" id="export">データ書き出し</button><button class="secondary" id="importBtn">データ読み込み</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></section><section class="panel"><h2>アイテムを選ぶ</h2><div class="tabs" id="tabs"></div><div class="row" style="margin-bottom:10px"><input id="search" placeholder="商品名で検索" aria-label="商品検索"><select id="sort" aria-label="並び順"><option value="new">登録順</option><option value="low">価格が安い順</option><option value="high">価格が高い順</option></select></div><div id="items" class="grid"></div><div style="border-top:1px solid #eee;margin-top:18px;padding-top:14px"><h2>商品を追加</h2><p class="muted">ZOZOTOWNの商品ページを見ながら、名前・価格・色・URLを入力して登録できるで。</p><label>商品名</label><input id="name" placeholder="例：オーバーサイズシャツ"><div class="row"><div><label>価格（円）</label><input id="price" type="number" min="0" placeholder="3980"></div><div><label>色</label><input id="color" type="color" value="#888888" style="height:43px;padding:4px"></div></div><label>商品URL（任意）</label><input id="url" type="url" placeholder="https://zozo.jp/..."><button id="add" style="width:100%;margin-top:12px">＋ 現在のカテゴリに登録</button></div><div style="margin-top:18px;border-top:1px solid #eee;padding-top:15px"><div class="muted">現在のコーデ合計</div><div id="total" class="total">¥0</div><label>予算（円・任意）</label><input id="budget" type="number" min="0" placeholder="例：20000"><div id="budgetStatus" class="muted" aria-live="polite"></div><div id="links"></div><div class="hint"><div class="rank"><span class="badge">ランキング</span><a href="https://zozo.jp/ranking/" target="_blank" rel="noopener noreferrer">ZOZOTOWN公式ランキングを開く ↗</a></div>ランキングの自動同期には対応していません。サンプル商品は架空のデータです。</div></div></section></main><script>
const cats=['トップス','ボトムス','シューズ'];const key='zozofit-items-v1',savedKey='zozofit-coords-v1';const examples=[{id:1,cat:0,name:'サンプル：白Tシャツ',price:2900,color:'#f4f4f0',url:''},{id:2,cat:0,name:'サンプル：黒シャツ',price:4500,color:'#252525',url:''},{id:3,cat:1,name:'サンプル：デニム',price:5900,color:'#54749c',url:''},{id:4,cat:1,name:'サンプル：黒パンツ',price:4900,color:'#252525',url:''},{id:5,cat:2,name:'サンプル：白スニーカー',price:7900,color:'#f7f7f7',url:''},{id:6,cat:2,name:'サンプル：黒シューズ',price:6900,color:'#292929',url:''}];let products=JSON.parse(localStorage.getItem(key)||'null')||examples,chosen=JSON.parse(localStorage.getItem('zozofit-chosen-v1')||'[null,null,null]'),cat=0;const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n).toLocaleString('ja-JP');function persist(){localStorage.setItem(key,JSON.stringify(products))}function render(){ $('tabs').innerHTML='';cats.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c;b.className=i===cat?'active':'secondary';b.onclick=()=>{cat=i;render()};$('tabs').append(b)});$('items').innerHTML='';products.filter(p=>p.cat===cat&&p.name.toLowerCase().includes(($('search').value||'').toLowerCase())).sort((a,b)=>$('sort').value==='low'?a.price-b.price:$('sort').value==='high'?b.price-a.price:b.id-a.id).forEach(p=>{let d=document.createElement('div');d.className='item'+(chosen[cat]===p.id?' selected':'');let s=document.createElement('div');s.className='swatch';s.style.background=p.color;s.textContent=['👕','👖','👟'][cat];let n=document.createElement('b');n.textContent=p.name;let price=document.createElement('span');price.textContent=yen(p.price);d.append(s,n,price);let del=document.createElement('button');del.className='secondary';del.textContent='削除';del.style.cssText='padding:5px 9px;margin-top:7px;font-size:11px';del.onclick=e=>{e.stopPropagation();if(!confirm('この商品を削除する？'))return;products=products.filter(x=>x.id!==p.id);chosen=chosen.map(id=>id===p.id?null:id);persist();render()};d.append(del);d.onclick=()=>{chosen[cat]=p.id;localStorage.setItem('zozofit-chosen-v1',JSON.stringify(chosen));render()};$('items').append(d)});let selected=chosen.map(id=>products.find(p=>p.id===id));$('topWear').style.background=selected[0]?.color||'#ddd';$('bottomWear').style.background=selected[1]?.color||'#343434';$('shoeL').style.background=$('shoeR').style.background=selected[2]?.color||'#eee';let sum=selected.reduce((a,p)=>a+(p?.price||0),0);$('total').textContent=yen(sum);let budget=Number($('budget').value);$('budgetStatus').textContent=budget>0?(sum>budget?'予算オーバー：'+yen(sum-budget):'予算残り：'+yen(budget-sum)):'';$('budgetStatus').style.color=sum>budget&&budget>0?'#c0392b':'#777';$('links').innerHTML='';selected.filter(p=>p?.url).forEach(p=>{let a=document.createElement('a');a.textContent='↗ '+p.name;a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';a.style.cssText='display:block;font-size:12px;margin-top:7px;color:#222';$('links').append(a)});showSaved()}
function showSaved(){let data=JSON.parse(localStorage.getItem(savedKey)||'[]');let box=$('saved');box.replaceChildren();let title=document.createElement('b');title.textContent='保存済みコーデ（'+data.length+'件）';box.append(title);data.slice().reverse().forEach((entry,reverseIndex)=>{let i=data.length-1-reverseIndex;let row=document.createElement('div');row.className='row';row.style.cssText='align-items:center;margin-top:8px;border-bottom:1px solid #eee;padding-bottom:7px';let name=document.createElement('span');name.textContent=new Date(entry.date).toLocaleDateString('ja-JP')+' · '+entry.items.filter(Boolean).map(x=>x.name).join(' / ');name.style.cssText='font-size:11px;overflow-wrap:anywhere';let load=document.createElement('button');load.textContent='呼び出す';load.className='secondary';load.onclick=()=>{entry.items.forEach(p=>{if(p&&!products.some(x=>x.id===p.id))products.push(p)});chosen=entry.items.map(p=>p?.id||null);persist();localStorage.setItem('zozofit-chosen-v1',JSON.stringify(chosen));render()};let del=document.createElement('button');del.textContent='×';del.className='secondary';del.onclick=()=>{data.splice(i,1);localStorage.setItem(savedKey,JSON.stringify(data));showSaved()};row.append(name,load,del);box.append(row)})} $('add').onclick=()=>{let name=$('name').value.trim(),price=Number($('price').value),url=$('url').value.trim();if(!name||!Number.isFinite(price)||price<0||$('price').value===''){alert('商品名と価格を入力してな');return}if(url){try{let u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw 0}catch{alert('URLを確認してな');return}}let p={id:Date.now(),cat,name,price,color:$('color').value,url};products.push(p);chosen[cat]=p.id;persist();$('name').value=$('price').value=$('url').value='';render()};$('reset').onclick=()=>{chosen=[null,null,null];localStorage.setItem('zozofit-chosen-v1',JSON.stringify(chosen));render()};$('save').onclick=()=>{let data=JSON.parse(localStorage.getItem(savedKey)||'[]');data.push({date:new Date().toISOString(),items:chosen.map(id=>products.find(p=>p.id===id)||null)});localStorage.setItem(savedKey,JSON.stringify(data));render();alert('コーデを端末に保存したで！')};$('shot').onclick=()=>{let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820"><rect width="100%" height="100%" fill="#f5f5f5"/><text x="40" y="70" font-size="30" font-family="sans-serif" font-weight="bold">ZOZO FIT STUDIO</text><circle cx="300" cy="155" r="45" fill="#d6b29a"/><rect x="276" y="190" width="48" height="35" fill="#d6b29a"/><rect x="180" y="230" width="38" height="270" rx="19" fill="#d6b29a"/><rect x="382" y="230" width="38" height="270" rx="19" fill="#d6b29a"/><path d="M225 225 L375 225 L390 430 L210 430 Z" fill="${products.find(p=>p.id===chosen[0])?.color||'#ddd'}"/><path d="M210 430 H390 L370 700 H310 L300 485 L290 700 H230 Z" fill="${products.find(p=>p.id===chosen[1])?.color||'#343434'}"/><rect x="215" y="690" width="85" height="32" rx="10" fill="${products.find(p=>p.id===chosen[2])?.color||'#eee'}"/><rect x="310" y="690" width="85" height="32" rx="10" fill="${products.find(p=>p.id===chosen[2])?.color||'#eee'}"/><text x="40" y="785" font-size="23" font-family="sans-serif">TOTAL ${$('total').textContent}</text></svg>`;let a=document.createElement('a');a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);a.download='outfit.svg';a.click()};$('search').oninput=render;$('sort').onchange=render;$('budget').value=localStorage.getItem('zozofit-budget-v1')||'';$('budget').oninput=()=>{localStorage.setItem('zozofit-budget-v1',$('budget').value);render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,products,chosen,saved:JSON.parse(localStorage.getItem(savedKey)||'[]')},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zozo-fit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.products)||!Array.isArray(data.chosen)||!Array.isArray(data.saved)||data.products.length>5000)throw Error();if(!data.products.every(p=>Number.isFinite(p.price)&&p.price>=0&&typeof p.name==='string'&&typeof p.color==='string'&&[0,1,2].includes(p.cat)))throw Error();if(!confirm('現在の商品・コーデをバックアップ内容で置き換える？'))return;products=data.products;chosen=data.chosen.slice(0,3);persist();localStorage.setItem(savedKey,JSON.stringify(data.saved));localStorage.setItem('zozofit-chosen-v1',JSON.stringify(chosen));render();alert('読み込み完了')}catch{alert('読み込めないデータ形式やで')}finally{e.target.value=''}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
